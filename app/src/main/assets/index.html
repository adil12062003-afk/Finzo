<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mera Hisab Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="top-header">
            <div class="logo-icon">₹</div>
            <div class="app-title">
                <h1>Mera Hisab Pro</h1>
                <p>Apne paise ka poora hisaab</p>
            </div>
        </header>

        <section class="balance-card">
            <p>Aapka Net Balance</p>
            <h2>₹ 0</h2>
            <div class="stats-row">
                <div class="stat-item"><p>Aamdani</p><span>₹ 0</span></div>
                <div class="stat-item"><p>Kharcha</p><span>₹ 0</span></div>
                <div class="stat-item"><p>Pending Udhaar</p><span>₹ 0</span></div>
            </div>
        </section>

        <!-- Quick Add Section -->
        <h3 class="section-title">Quick Add <span class="subtitle">Ek tap mein entry</span></h3>
        <div class="quick-add-grid">
            <div class="action-btn">💰<br>Income</div>
            <div class="action-btn">🛍️<br>Kharcha</div>
            <div class="action-btn">🤝<br>Udhaar lena</div>
            <div class="action-btn">📩<br>Udhaar dena</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active">🏠<br>Home</div>
        <div class="nav-item">📊<br>Hisab</div>
        <div class="nav-item">📈<br>Report</div>
        <div class="nav-item">☁️<br>Backup</div>
    </nav>
    <script src="script.js"></script>
</body>
</html>
